      background: #f8fafc;

      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      font-family: inherit;

    let sequenceOrders = {};
    let matchAnswers = {};

    const viewQuiz = document.getElementById('view-quiz');
    const viewResults = document.getElementById('view-results');
    const questionBody = document.getElementById('question-body');
    const progressNum = document.getElementById('progress-num');
    const totalQuestionsSpan = document.getElementById('total-questions');
    const questionNumSpan = document.getElementById('question-num');
    const progressFill = document.getElementById('progress-fill');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFinish = document.getElementById('btn-finish');
    const btnRestart = document.getElementById('btn-restart');
    const resultsContent = document.getElementById('results-content');
    const savedHint = document.getElementById('saved-hint');

    const menuToggle = document.querySelector('.menu-toggle');
    const navMobile = document.querySelector('.nav-mobile');
    if (menuToggle) {
      menuToggle.addEventListener('click', () => navMobile.classList.toggle('open'));
    }

    function getTypeName(type) {
      const names = { single: "Один вариант", multiple: "Несколько вариантов", match: "Соответствие", sequence: "Последовательность", short: "Краткий ответ", phrase: "Ответ словосочетанием" };
      return names[type] || type;
    }

    function startQuiz() {
      userAnswers = new Array(questions.length).fill(null);
      sequenceOrders = {};
      matchAnswers = {};
      loadSavedAnswers();
      totalQuestionsSpan.textContent = questions.length;
      updateProgress();
      currentIndex = 0;
      renderQuestion();
      viewQuiz.style.display = 'block';
      viewResults.style.display = 'none';
    }

    function loadSavedAnswers() {
      const saved = localStorage.getItem('rag_quiz_no_emoji');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.userAnswers && Array.isArray(parsed.userAnswers) && parsed.userAnswers.length === questions.length) {
            userAnswers = parsed.userAnswers;
          }
          if (parsed.sequenceOrders) sequenceOrders = parsed.sequenceOrders;
          if (parsed.matchAnswers) matchAnswers = parsed.matchAnswers;
        } catch(e) {}
      }
    }

    function saveAnswers() {
      const saveData = { userAnswers, sequenceOrders, matchAnswers };
      localStorage.setItem('rag_quiz_no_emoji', JSON.stringify(saveData));
      savedHint.style.opacity = '1';
      setTimeout(() => savedHint.style.opacity = '0.7', 1000);
    }

    function getAnsweredCount() {
      let count = 0;
      for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const ans = userAnswers[i];
        if (ans === null || ans === undefined || ans === '') continue;
        if (q.type === 'match') {
          if (matchAnswers[i] && Object.keys(matchAnswers[i]).length === q.pairs.length) count++;
        } else if (q.type === 'sequence') {
          if (sequenceOrders[i] && sequenceOrders[i].length === q.items.length) count++;
        } else if (q.type === 'single') {
          if (ans !== null && ans !== undefined) count++;
        } else if (q.type === 'multiple') {
          if (Array.isArray(ans) && ans.length > 0) count++;
        } else if (ans && ans.trim() !== '') count++;
      }
      return count;
    }

    function updateProgress() {
      const answered = getAnsweredCount();
      progressNum.textContent = answered;
      const percent = (answered / questions.length) * 100;
      progressFill.style.width = `${percent}%`;
    }

    function renderQuestion() {
      if (!questions.length || currentIndex >= questions.length) return;
      const q = questions[currentIndex];
      const currentAnswer = userAnswers[currentIndex];
      
      let html = `<div class="question-type-badge">${getTypeName(q.type)}</div>`;
      html += `<p class="question-text">${escapeHtml(q.text)}</p>`;
      
      if (q.type === 'single') {
        html += `<div class="quiz-options">`;
        q.options.forEach((opt, idx) => {
          const letter = String.fromCharCode(65 + idx);
          const isChecked = (currentAnswer === idx);
          html += `<label class="quiz-option"><input type="radio" name="question" value="${idx}" ${isChecked ? 'checked' : ''}><span><strong>${letter}.</strong> ${escapeHtml(opt)}</span></label>`;
        });
        html += `</div>`;
      } 
      else if (q.type === 'multiple') {
        const selectedSet = currentAnswer ? new Set(currentAnswer) : new Set();
        html += `<div class="quiz-options">`;
        q.options.forEach((opt, idx) => {
          const letter = String.fromCharCode(65 + idx);
          const isChecked = selectedSet.has(idx);
          html += `<label class="quiz-option"><input type="checkbox" name="question" value="${idx}" ${isChecked ? 'checked' : ''}><span><strong>${letter}.</strong> ${escapeHtml(opt)}</span></label>`;
        });
        html += `<div class="quiz-hint">Выберите все подходящие варианты</div></div>`;
      }
      else if (q.type === 'match') {
        const savedMatches = matchAnswers[currentIndex] || {};
        html += `<div class="match-container">`;
        q.pairs.forEach((pair, idx) => {
          const selected = savedMatches[idx] || '';
          html += `<div class="match-row">
            <div class="match-left">${escapeHtml(pair.left)}</div>
            <div class="match-right">
              <select data-match-idx="${idx}">
                <option value="">-- выберите соответствие --</option>`;
          pair.options.forEach(opt => {
            html += `<option value="${escapeHtml(opt)}" ${selected === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>`;
          });
          html += `</select></div></div>`;
        });
        html += `<div class="quiz-hint">К каждому элементу слева подберите правильный вариант из списка</div></div>`;
      }
      else if (q.type === 'sequence') {
        const currentOrder = sequenceOrders[currentIndex] || [...q.items];
        html += `<div class="sequence-items" id="sequence-container">`;
        currentOrder.forEach((item, idx) => {
          html += `<div class="sequence-item" draggable="true" data-idx="${idx}">
            <span class="sequence-handle">⋮⋮</span>
            <span class="sequence-number">${idx + 1}</span>
            <span>${escapeHtml(item)}</span>
          </div>`;
        });
        html += `</div><div class="quiz-hint">Перетащите строки мышкой, чтобы установить правильный порядок</div>`;
      }
      else if (q.type === 'short') {
        html += `<input type="text" class="short-answer-input" id="short-answer" placeholder="Введите ответ словосочетанием" value="${escapeHtml(currentAnswer || '')}">`;
        html += `<div class="quiz-hint">Напишите краткий ответ (команду, термин или название)</div>`;
      }
      else if (q.type === 'phrase') {
        html += `<input type="text" class="short-answer-input" id="phrase-answer" placeholder="Введите ответ словосочетанием или короткой фразой" value="${escapeHtml(currentAnswer || '')}">`;
        html += `<div class="quiz-hint">Напишите ответ в виде словосочетания или одного предложения</div>`;
      }
      
      questionBody.innerHTML = html;
      questionNumSpan.textContent = `Вопрос ${currentIndex + 1} из ${questions.length}`;
      btnPrev.style.display = currentIndex === 0 ? 'none' : 'inline-flex';
      
      if (currentIndex === questions.length - 1) {
        btnNext.style.display = 'none';
        btnFinish.style.display = 'inline-flex';
      } else {
        btnNext.style.display = 'inline-flex';
        btnFinish.style.display = 'none';
      }
      
      attachAnswerHandlers(q);
    }

    function attachAnswerHandlers(q) {
      if (q.type === 'single' || q.type === 'multiple') {
        const inputs = questionBody.querySelectorAll('input');
        inputs.forEach(input => {
          input.addEventListener('change', () => saveCurrentAnswer());
        });
      } 
      else if (q.type === 'match') {
        const selects = questionBody.querySelectorAll('select');
        selects.forEach(select => {
          select.addEventListener('change', () => saveCurrentAnswer());
        });
      }
      else if (q.type === 'short') {
        const input = document.getElementById('short-answer');
        if (input) input.addEventListener('input', () => saveCurrentAnswer());
      }
      else if (q.type === 'phrase') {
        const input = document.getElementById('phrase-answer');
        if (input) input.addEventListener('input', () => saveCurrentAnswer());
      }
      else if (q.type === 'sequence') {
        initDragAndDrop();
      }
    }

    function initDragAndDrop() {
      const container = document.getElementById('sequence-container');
      if (!container) return;
      let dragSrcIndex = null;
      const items = container.querySelectorAll('.sequence-item');
      
      items.forEach(item => {
        item.addEventListener('dragstart', (e) => {
          dragSrcIndex = parseInt(item.dataset.idx);
          e.dataTransfer.effectAllowed = 'move';
          item.classList.add('dragging');
        });
        item.addEventListener('dragend', (e) => {
          item.classList.remove('dragging');
        });
        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const dragTarget = e.target.closest('.sequence-item');
          if (!dragTarget) return;
          const dragTargetIndex = parseInt(dragTarget.dataset.idx);
          if (dragSrcIndex === dragTargetIndex) return;
          
          const itemsArray = Array.from(container.querySelectorAll('.sequence-item'));
          const draggedItem = itemsArray[dragSrcIndex];
          const targetItem = itemsArray[dragTargetIndex];
          
          if (dragSrcIndex < dragTargetIndex) {
            targetItem.insertAdjacentElement('afterend', draggedItem);
          } else {
            targetItem.insertAdjacentElement('beforebegin', draggedItem);
          }
          
          updateSequenceIndexes();
          saveCurrentAnswer();
        });
      });
    }

    function updateSequenceIndexes() {
      const container = document.getElementById('sequence-container');
      if (!container) return;
      const items = container.querySelectorAll('.sequence-item');
      const newOrder = [];
      items.forEach((item, idx) => {
        item.dataset.idx = idx;
        const numberSpan = item.querySelector('.sequence-number');
        if (numberSpan) numberSpan.textContent = idx + 1;
        const textSpan = item.querySelector('span:last-child');
        if (textSpan) newOrder.push(textSpan.textContent);
      });
      sequenceOrders[currentIndex] = newOrder;
    }

    function saveCurrentAnswer() {
      const q = questions[currentIndex];
      
      if (q.type === 'single') {
        const inputs = questionBody.querySelectorAll('input[type="radio"]');
        for (let i = 0; i < inputs.length; i++) {
          if (inputs[i].checked) {
            userAnswers[currentIndex] = parseInt(inputs[i].value);
            break;
          }
        }
      } 
      else if (q.type === 'multiple') {
        const inputs = questionBody.querySelectorAll('input[type="checkbox"]');
        const selected = [];
        inputs.forEach(input => {
          if (input.checked) selected.push(parseInt(input.value));
        });
        userAnswers[currentIndex] = selected.length > 0 ? selected : null;
      }
      else if (q.type === 'match') {
        const selects = questionBody.querySelectorAll('select');
        const matches = {};
        selects.forEach((select, idx) => {
          if (select.value) matches[idx] = select.value;
        });
        matchAnswers[currentIndex] = Object.keys(matches).length > 0 ? matches : null;
        userAnswers[currentIndex] = matchAnswers[currentIndex] ? 'filled' : null;
      }
      else if (q.type === 'sequence') {
        if (sequenceOrders[currentIndex] && sequenceOrders[currentIndex].length === q.items.length) {
          userAnswers[currentIndex] = sequenceOrders[currentIndex];
        } else {
          userAnswers[currentIndex] = null;
        }
      }
      else if (q.type === 'short') {
        const input = document.getElementById('short-answer');
        if (input) userAnswers[currentIndex] = input.value.trim() || null;
      }
      else if (q.type === 'phrase') {
        const input = document.getElementById('phrase-answer');
        if (input) userAnswers[currentIndex] = input.value.trim() || null;
      }
      
      updateProgress();
      saveAnswers();
    }

    function nextQuestion() {
      saveCurrentAnswer();
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function prevQuestion() {
      saveCurrentAnswer();
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function checkTextAnswer(userAnswer, correctKeywords) {
      if (!userAnswer || userAnswer.trim() === '') return false;
      const lowerAnswer = userAnswer.toLowerCase();
      return correctKeywords.some(keyword => 
        lowerAnswer.includes(keyword.toLowerCase())
      );
    }

    function checkMatchAnswer(q, savedMatches) {
      if (!savedMatches) return false;
      for (let i = 0; i < q.pairs.length; i++) {
        if (savedMatches[i] !== q.pairs[i].right) return false;
      }
      return true;
    }

    function checkSequenceAnswer(q, savedOrder) {
      if (!savedOrder) return false;
      for (let i = 0; i < q.correct.length; i++) {
        if (savedOrder[i] !== q.items[q.correct[i]]) return false;
      }
      return true;
    }

    function getGradeLetter(percentage) {
      if (percentage >= 90) return { letter: "A", description: "отлично" };
      if (percentage >= 80) return { letter: "B", description: "хорошо" };
      if (percentage >= 70) return { letter: "C", description: "удовлетворительно" };
      if (percentage >= 60) return { letter: "D", description: "посредственно" };
      return { letter: "E", description: "неудовлетворительно" };
    }

    function finishQuiz() {
      saveCurrentAnswer();
      
      let correctCount = 0;
      const results = [];
      
      questions.forEach((q, idx) => {
        const userAnswer = userAnswers[idx];
        let isCorrect = false;
        let userAnswerText = '';
        let correctAnswerText = '';
        
        if (q.type === 'single') {
          if (userAnswer !== null && userAnswer !== undefined) {
            userAnswerText = q.options[userAnswer];
            isCorrect = (userAnswer === q.correct);
            correctAnswerText = q.options[q.correct];
          } else {
            userAnswerText = "Не отвечен";
          }
        } 
        else if (q.type === 'multiple') {
          if (userAnswer && Array.isArray(userAnswer) && userAnswer.length > 0) {
            const correctSet = new Set(q.correct);
            const userSet = new Set(userAnswer);
            isCorrect = userSet.size === correctSet.size && [...userSet].every(v => correctSet.has(v));
            userAnswerText = userAnswer.map(i => q.options[i]).join(', ');
            correctAnswerText = q.correct.map(i => q.options[i]).join(', ');
          } else {
            userAnswerText = "Не отвечен";
          }
        }
        else if (q.type === 'match') {
          const savedMatches = matchAnswers[idx];
          if (savedMatches && Object.keys(savedMatches).length === q.pairs.length) {
            isCorrect = checkMatchAnswer(q, savedMatches);
            userAnswerText = Object.values(savedMatches).join('; ');
            correctAnswerText = q.pairs.map(p => `${p.left} -> ${p.right}`).join('; ');
          } else {
            userAnswerText = "Не отвечен";
          }
        }
        else if (q.type === 'sequence') {
          const savedOrder = sequenceOrders[idx];
          if (savedOrder && savedOrder.length === q.items.length) {
            isCorrect = checkSequenceAnswer(q, savedOrder);
            userAnswerText = savedOrder.join(' -> ');
            correctAnswerText = q.correct.map(i => q.items[i]).join(' -> ');
          } else {
            userAnswerText = "Не отвечен";
          }
        }
        else if (q.type === 'short' || q.type === 'phrase') {
          if (userAnswer && userAnswer.trim() !== '') {
            isCorrect = checkTextAnswer(userAnswer, q.correctKeywords);
            userAnswerText = userAnswer;
            correctAnswerText = q.correctKeywords.join(' или ');
          } else {
            userAnswerText = "Не отвечен";
          }
        }
        
        if (isCorrect) correctCount++;
        
        results.push({
          question: q.text,
          type: getTypeName(q.type),
          userAnswer: userAnswerText,
          isCorrect: isCorrect,
          correctAnswer: correctAnswerText
        });
      });
      
      const percentage = Math.round((correctCount / questions.length) * 100);
      const grade = getGradeLetter(percentage);
      
      let resultsHtml = `
        <div class="results-header">
          <h2>Результаты тестирования</h2>
          <div class="results-score">${correctCount} из ${questions.length} правильных ответов</div>
          <div class="results-percentage">${percentage}%</div>
          <div class="results-grade">Оценка: ${grade.letter} (${grade.description})</div>
        </div>
        <div class="results-details">
          <h3>Детальный разбор:</h3>
      `;
      
      results.forEach((res, idx) => {
        resultsHtml += `
          <div class="result-item">
            <div style="display: flex; gap: 0.75rem; align-items: flex-start;">
              <span style="font-size: 1.2rem;">${res.isCorrect ? '+' : '-'}</span>
              <div style="flex: 1;">
                <strong>Вопрос ${idx + 1}</strong> <span style="font-size: 0.7rem; color: #666;">[${res.type}]</span><br>
                <span>${escapeHtml(res.question)}</span><br>
                <span style="color: ${res.isCorrect ? '#2e7d32' : '#c62828'}; font-size: 0.9rem;">
                  <strong>Ваш ответ:</strong> ${escapeHtml(res.userAnswer)}
                </span><br>
                ${!res.isCorrect && res.correctAnswer ? `<span style="color: #1565c0; font-size: 0.9rem;"><strong>Правильный ответ:</strong> ${escapeHtml(res.correctAnswer)}</span><br>` : ''}
              </div>
            </div>
          </div>
        `;
      });
      
      resultsHtml += `</div>`;
      resultsContent.innerHTML = resultsHtml;
      
      viewQuiz.style.display = 'none';
      viewResults.style.display = 'block';
    }

    function restartQuiz() {
      userAnswers = new Array(questions.length).fill(null);
      sequenceOrders = {};
      matchAnswers = {};
      currentIndex = 0;
      saveAnswers();
      updateProgress();
      renderQuestion();
      viewQuiz.style.display = 'block';
      viewResults.style.display = 'none';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    btnNext.addEventListener('click', nextQuestion);
    btnPrev.addEventListener('click', prevQuestion);
    btnFinish.addEventListener('click', finishQuiz);
    btnRestart.addEventListener('click', restartQuiz);
    
    startQuiz();
  </script>
</body>
</html>
